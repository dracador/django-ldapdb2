name: Django CI Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']  # based on Django 5.2 (LTS) + 6.0 + 6.1

    steps:
    - name: Install LDAP deps
      run: |
        sudo apt-get update
        sudo apt install -y libldap2-dev libsasl2-dev

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Cache uv and tox
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.cache/uv
          .tox
        key: ${{ runner.os }}-py${{ matrix.python-version }}-uv-tox-${{ hashFiles('**/tox.ini', '**/pyproject.toml', '**/poetry.lock', '**/requirements*.txt', '**/setup.cfg', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-uv-tox-

    - name: Install Dependencies
      run: |
        python -m pip install uv tox-uv tox-gh

    - name: Run Tests
      env:
        UV_LINK_MODE: copy
      run: tox
